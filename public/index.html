<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <base href="/" />
    <title>vanilla-hn</title>
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Firebase uses dynamic *.firebaseio.com subdomains for WebSocket/long-poll connections -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; script-src 'self' 'unsafe-inline' https://*.firebaseio.com; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com; style-src 'self' 'unsafe-inline'; frame-src https://*.firebaseio.com;"
    />

    <!-- Development-only import map; production builds resolve Firebase from npm. -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "./vendor/firebase-app.js",
          "firebase/database": "./vendor/firebase-database.js"
        }
      }
    </script>

    <script>
      (() => {
        try {
          const raw = localStorage.getItem("vanilla-hn:settings:v1");
          if (!raw) return;
          const settings = JSON.parse(raw);
          const root = document.documentElement;
          const theme = settings?.theme;

          if (theme === "dark") {
            root.style.setProperty("color-scheme", "dark");
            root.style.setProperty("--override-hn-bg", "#0b0b0b");
            root.style.setProperty("--override-hn-text", "#e6e6e6");
            root.style.setProperty("--override-hn-muted", "#929292");
            root.style.setProperty("--override-hn-accent", "#7ee787");
          } else if (theme === "light") {
            root.style.setProperty("color-scheme", "light");
            root.style.setProperty("--override-hn-bg", "#ffffff");
            root.style.setProperty("--override-hn-text", "#111111");
            root.style.setProperty("--override-hn-muted", "#666666");
            root.style.setProperty("--override-hn-accent", "#2f9e44");
          }

          if (settings.titleFontSize) {
            root.style.setProperty(
              "--font-size-title",
              `${Number(settings.titleFontSize) || 18}px`,
            );
          }
          if (settings.listSpacing) {
            root.setAttribute("data-list-spacing", String(settings.listSpacing));
          }
        } catch (_) {
          /* Keep first paint resilient if storage is blocked. */
        }
      })();
    </script>

    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <!-- Skip link for keyboard / screen-reader users -->
    <a id="skip-to-content" class="visually-hidden" href="#app">Skip to content</a>

    <!--
          .app-wrap mirrors react-hn's .App__wrap:
            width:90%; max-width:1280px; margin:8px auto; background:#f5f5f5
          All three regions (header, main, footer) live inside it so the
          background card effect is identical to the original.
        -->
    <div class="app-wrap">
      <!--
              Header mirrors react-hn's .App__header layout exactly:
                [logo] [homelink] [nav links | pipe-separated] [settings]
              Semantic <header> + <nav> is kept for accessibility while CSS
              makes it render as a single flat bar.
            -->
      <header class="site-header">
        <a href="./" class="homelink-icon" aria-label="vanilla-hn home">
          <img src="img/logo.png" width="16" height="16" alt="" />
        </a>
        <a href="./" class="homelink">vanilla-hn</a>
        <nav aria-label="Primary navigation" class="main-nav">
          <ul>
            <li><a href="newest">new</a></li>
            <li><a href="newcomments">comments</a></li>
            <li><a href="show">show</a></li>
            <li><a href="ask">ask</a></li>
            <li><a href="jobs">jobs</a></li>
            <li><a href="read">read</a></li>
          </ul>
        </nav>
        <button
          class="settings"
          aria-expanded="false"
          aria-controls="settings-panel"
          popovertarget="settings-panel"
          type="button"
          disabled
        >
          settings
        </button>

        <!-- Settings panel — shown by the native Popover API -->
        <div
          class="settings-panel"
          id="settings-panel"
          popover="auto"
          role="dialog"
          aria-labelledby="settings-heading"
          tabindex="-1"
        >
          <h2 id="settings-heading" class="visually-hidden">Settings</h2>
          <form id="settings-form">
            <div class="setting">
              <label>
                <input type="checkbox" name="autoCollapse" id="s-autoCollapse" />
                auto collapse
              </label>
              <p>Automatically collapse threads without new comments on load.</p>
            </div>
            <div class="setting">
              <label>
                <input type="checkbox" name="replyLinks" id="s-replyLinks" />
                show reply links
              </label>
              <p>Show "reply" links to Hacker News.</p>
            </div>
            <div class="setting">
              <label>
                <input type="checkbox" name="showDead" id="s-showDead" />
                show dead
              </label>
              <p>Show items flagged as dead.</p>
            </div>
            <div class="setting">
              <label>
                <input type="checkbox" name="showDeleted" id="s-showDeleted" />
                show deleted
              </label>
              <p>Show comments flagged as deleted.</p>
            </div>
            <div class="setting">
              <table>
                <tbody>
                  <tr>
                    <td>
                      <label for="s-titleFontSize">title font size:</label>
                    </td>
                    <td>
                      <input
                        type="number"
                        min="10"
                        max="30"
                        step="1"
                        name="titleFontSize"
                        id="s-titleFontSize"
                        value="18"
                      />
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <label for="s-listSpacing">list spacing:</label>
                    </td>
                    <td>
                      <select name="listSpacing" id="s-listSpacing">
                        <option value="compact">compact</option>
                        <option value="normal" selected>normal</option>
                        <option value="spacious">spacious</option>
                      </select>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <label for="s-theme">theme:</label>
                    </td>
                    <td>
                      <select name="theme" id="s-theme">
                        <option value="light" selected>light</option>
                        <option value="dark">dark</option>
                        <option value="system">system</option>
                      </select>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </form>
        </div>
      </header>

      <!-- Main content mount point — views render here -->
      <main id="app"></main>

      <!-- Footer mirrors react-hn's .App__footer -->
      <footer class="site-footer">
        vanilla-hn v<span data-app-version>0.1.0</span> |
        <a data-source-link href="https://github.com/asuh/vanilla-hn">asuh/vanilla-hn</a>
      </footer>
    </div>
    <!-- /.app-wrap -->

    <script type="module" src="src/main.js"></script>
  </body>
</html>
