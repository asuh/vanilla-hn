<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>vanilla-hn</title>

        <!-- Content Security Policy: scripts from self only; Firebase connects to HN realtime DB -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'unsafe-inline' https://hacker-news.firebaseio.com; connect-src 'self' https://hacker-news.firebaseio.com wss://hacker-news.firebaseio.com; style-src 'self' 'unsafe-inline';"
        />

        <!-- Import map: resolves firebase bare specifiers to locally vendored files -->
        <script type="importmap">
            {
                "imports": {
                    "firebase/app": "/vendor/firebase-app.js",
                    "firebase/database": "/vendor/firebase-database.js"
                }
            }
        </script>

        <link rel="stylesheet" href="/src/styles.css" />
    </head>
    <body>
        <a id="skip-to-content" class="visually-hidden" href="#app"
            >Skip to content</a
        >

        <header role="banner" class="site-header">
            <div class="container">
                <h1 class="site-title"><a href="#/">vanilla-hn</a></h1>
                <nav
                    role="navigation"
                    aria-label="Primary navigation"
                    class="main-nav"
                >
                    <ul>
                        <li><a href="#/">news</a></li>
                        <li><a href="#/newest">new</a></li>
                        <li><a href="#/ask">ask</a></li>
                        <li><a href="#/show">show</a></li>
                        <li><a href="#/jobs">jobs</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main id="app" role="main" class="app-container" tabindex="-1"></main>

        <footer role="contentinfo" class="site-footer">
            <div class="container">
                <small>vanilla-hn</small>
            </div>
        </footer>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
